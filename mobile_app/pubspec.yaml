name: delivery_marker_mobile
description: Delivery Location Marker Mobile App for Shippers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^14.0.0
  url_launcher: ^6.2.5
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
