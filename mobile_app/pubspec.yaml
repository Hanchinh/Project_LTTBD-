name: delivery_marker_mobile
description: Delivery Location Marker Mobile App for Shippers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^14.0.0
  url_launcher: ^6.2.5
  http: ^1.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^5.0.2
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  image: ^4.12.0
  crypto: ^3.0.8
  archive: ^4.5.2
  share_plus: ^13.3.1
  file_picker: ^13.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.4.4

dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
