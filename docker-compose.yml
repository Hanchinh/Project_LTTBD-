version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: delivery_postgis_db
    restart: always
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery_backend_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: delivery_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: super_secret_delivery_jwt_key_2026_xyz
    depends_on:
      postgres:
        condition: service_healthy

  admin_web:
    build:
      context: ./admin_web
      dockerfile: Dockerfile
    container_name: delivery_admin_web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:


